<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/main.css}">
	<title>Chess Site - Login</title>
</head>
<body>
	<div class="login-container">
	    <h1>Login</h1>
	    <form id="loginForm" th:action="@{/login}" method="post">
	        <input type="text" name="bruker" placeholder="Username" required>
	        <input type="password" name="passord" placeholder="Password" required>
	        <button type="submit">Sign In</button>
	        <div id="errorMessage" class="error-message" th:text="${redirectMessage}"></div>
	    </form>
	    <div class="login-link">
	    	<a th:href="@{/registrer}">Create Account</a>
	    </div>
	</div>
</body>
</html>
