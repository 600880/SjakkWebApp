<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chess Simulator</title>
	<link rel="stylesheet" th:href="@{/main.css}">	
	<!-- Chessboard.js -->
	<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD" crossorigin="anonymous"></script>
	<!-- Chess.js for move validation and board state -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
	<!-- JavaScript -->
	<script th:src="@{/main.js}" type="module"></script>
</head>

<body>
<div id="notification-container"></div>
<header>
    <h1>Chess Simulator</h1>
    <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;"></form>
    <button id="logoutBtn" onclick="document.getElementById('logoutForm').submit()">Log Out</button>
</header>

<div class="tabs">
    <div class="tab active" data-tab="play">Play</div>
    <div class="tab" data-tab="archive">Archive</div>
</div>

<div id="play" class="tab-content">
    <div class="play-section">
        <div class="game-layout">
            <div class="board-column">
                <div class="timer-container" id="black-timer-container">
                    <span class="player-name" id="black-player-name">Black</span>
                    <div class="captured-pieces-row" id="captured-white"></div>
                    <span class="timer" id="black-timer">05:00</span>
                </div>
                <div id="board"></div>
                <div class="timer-container" id="white-timer-container">
                    <span class="player-name" id="white-player-name">White</span>
                    <div class="captured-pieces-row" id="captured-black"></div>
                    <span class="timer" id="white-timer">05:00</span>
                </div>
                <div id="output">Choose a mode to start</div>
            </div>
            <div class="controls-panel">
                <div class="control-group compact-row">
                    <div class="setting-item">
                        <label>Strength:</label>
                        <div id="cpuLevelBar" class="level-bar">
                            <span class="level-btn" data-level="1">1</span>
                            <span class="level-btn" data-level="2">2</span>
                            <span class="level-btn" data-level="3">3</span>
                            <span class="level-btn active" data-level="4">4</span>
                            <span class="level-btn" data-level="5">5</span>
                            <span class="level-btn" data-level="6">6</span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Color:</label>
                        <button id="colorToggleBtn" class="color-toggle white" title="Toggle Color">
                            <span class="color-circle"></span>
                        </button>
                    </div>
                </div>
                <div class="control-group timer-settings">
                    <div class="setting-item">
                        <label for="startTime">Time (min):</label>
                        <input type="number" id="startTime" value="5" min="1" max="60" style="width: 55px; padding: 5px;">
                    </div>
                    <div class="setting-item">
                        <label for="increment">Inc (sec):</label>
                        <input type="number" id="increment" value="0" min="0" max="60" style="width: 55px; padding: 5px;">
                    </div>
                </div>
                <div class="control-group" style="justify-content: flex-start; gap: 10px;">
                    <input type="checkbox" id="specialEffects" style="width: auto; margin: 0;">
                    <label for="specialEffects" style="font-weight: normal; cursor: pointer;">Special effects</label>
                </div>
                <div class="button-group">
                    <button id="playBtn">Play vs CPU</button>
                    <button id="simulateBtn">Simulate</button>
                    <button id="resetBtn" class="reset-btn" disabled>Abort</button>
                </div>
                <div class="button-group">
                    <button id="askAiBtn">Ask AI</button>
                </div>
                <div class="online-section">
                    <h4>Online Users</h4>
                    <button id="refreshUsersBtn">Refresh</button>
                    <ul id="online-users"></ul>
                </div>
                <div id="chat-container" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; border-radius: 5px;">
                    <h4>Chat</h4>
                    <div id="chat-messages" style="height: 150px; overflow-y: auto; background: #f9f9f9; padding: 5px; margin-bottom: 10px; border: 1px solid #ddd; font-size: 14px;"></div>
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <input type="text" id="chatInput" placeholder="Type a message..." style="flex: 1; margin: 0; padding: 8px;" disabled>
                        <button id="sendChatBtn" style="width: 35px; height: 35px; min-width: 35px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; background-color: #2c6e49; border-radius: 4px; border: none; color: white; cursor: pointer;" disabled>
                            <span style="transform: rotate(0deg); font-size: 18px;">➤</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="archive" class="tab-content" style="display:none;">
    <div class="archive-section">
        <h3>Saved Games</h3>
        
        <!-- Game List View -->
        <div id="gameListView">
            <table>
                <thead>
                    <tr>
                        <th>White</th>
                        <th>Black</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="archive-list"></tbody>
            </table>
        </div>
        
        <!-- Game Replay View -->
        <div id="replayView" style="display:none;">
            <div class="replay-header">
                <button id="backToArchiveBtn">← Back</button>
                <h3><span id="replayPlayers"></span></h3>
            </div>
            
            <div class="replay-layout">
                <!-- Board on the left -->
                <div class="board-container">
                    <div id="replayBoard"></div>
                    <div class="control-buttons">
                        <button id="firstMoveBtn" class="control-btn">⏮</button>
                        <button id="prevMoveBtn" class="control-btn">◀</button>
                        <button id="nextMoveBtn" class="control-btn">▶</button>
                        <button id="lastMoveBtn" class="control-btn">⏭</button>
                    </div>
                    <div class="move-info">Move: <span id="currentMoveNum">0/0</span></div>
                </div>
                
                <!-- PGN on the right -->
                <div class="pgn-container">
                    <div id="pgnDisplay"></div>
                    <div id="errorMsg"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
