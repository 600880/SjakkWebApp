<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chess Simulator</title>
	<link rel="stylesheet" th:href="@{/main.css}">	
	<!-- Chessboard.js -->
	<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD" crossorigin="anonymous"></script>
	<!-- Chess.js for move validation and board state -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
	<!-- JavaScript -->
	<script th:src="@{/main.js}" defer></script>
</head>

<body>
<div id="notification-container"></div>
<header>
    <h1>Chess Simulator</h1>
    <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;"></form>
    <button onclick="document.getElementById('logoutForm').submit()">Log Out</button>
</header>

<div class="tabs">
    <div class="tab active" onclick="switchTab('play')">Play</div>
    <div class="tab" onclick="switchTab('archive')">Archive</div>
</div>

<div id="play" class="tab-content">
    <div class="play-section">
        <div class="game-layout">
            <div id="board"></div>
            <div class="controls-panel">
                <div class="control-group">
                    <label for="cpuLevel">CPU Level:</label>
                    <select id="cpuLevel">
                        <option value="1">1 (Fastest)</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4 (Normal)</option>
                        <option value="5">5</option>
                        <option value="6">6 (Strongest)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="playBtn" onclick="startInteractive()">Play vs CPU</button>
                    <button id="simulateBtn" onclick="startSimulation()">Simulate</button>
                    <button id="resetBtn" class="reset-btn" onclick="resetGame()" disabled>Reset</button>
                </div>
                <div class="button-group">
                    <button id="askAiBtn" onclick="askAI()">Ask AI</button>
                </div>
                <div class="online-section">
                    <h4>Online Users</h4>
                    <button onclick="refreshOnlineUsers()">Refresh</button>
                    <ul id="online-users"></ul>
                </div>
            </div>
        </div>
        <div id="output">Choose a mode to start</div>
    </div>
</div>

<div id="archive" class="tab-content" style="display:none;">
    <div class="archive-section">
        <h3>Saved Games</h3>
        
        <!-- Game List View -->
        <div id="gameListView">
            <table>
                <thead>
                    <tr>
                        <th>White</th>
                        <th>Black</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="archive-list"></tbody>
            </table>
        </div>
        
        <!-- Game Replay View -->
        <div id="replayView" style="display:none;">
            <div class="replay-header">
                <button onclick="backToGameList()">← Back</button>
                <h3><span id="replayPlayers"></span></h3>
            </div>
            
            <div class="replay-layout">
                <!-- Board on the left -->
                <div class="board-container">
                    <div id="replayBoard"></div>
                    <div class="control-buttons">
                        <button class="control-btn" onclick="firstMove()">⏮</button>
                        <button class="control-btn" onclick="prevMove()">◀</button>
                        <button class="control-btn" onclick="nextMove()">▶</button>
                        <button class="control-btn" onclick="lastMove()">⏭</button>
                    </div>
                    <div class="move-info">Move: <span id="currentMoveNum">0/0</span></div>
                </div>
                
                <!-- PGN on the right -->
                <div class="pgn-container">
                    <div id="pgnDisplay"></div>
                    <div id="errorMsg"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
